[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "diffnote"
version = "0.1.0"
description = "Offline-first git diff → PR / changelog summary in one command."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["git", "diff", "changelog", "pull-request", "cli", "release-notes"]
authors = [{ name = "diffnote contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LucasXlab/diffnote"
Repository = "https://github.com/LucasXlab/diffnote"
Documentation = "https://github.com/LucasXlab/diffnote#readme"

[project.scripts]
diffnote = "diffnote.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]
assets = ["pillow==13.0.0"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.2", "build==1.6.1", "setuptools==84.2.1", "wheel==0.48.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["diffnote"]

[tool.coverage.report]
fail_under = 70
show_missing = true
