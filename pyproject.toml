[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffnote"
version = "0.1.0"
description = "Offline-first git diff → PR / changelog summary in one command."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["git", "diff", "changelog", "pull-request", "cli", "release-notes"]
authors = [{ name = "diffnote contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LucasYanzy/diffnote"
Repository = "https://github.com/LucasYanzy/diffnote"
Documentation = "https://github.com/LucasYanzy/diffnote#readme"

[project.scripts]
diffnote = "diffnote.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
