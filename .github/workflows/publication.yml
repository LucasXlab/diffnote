name: Publication checks

on:
  push:
    branches: [main, "noah/**"]
  pull_request:

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/check_publication.py
