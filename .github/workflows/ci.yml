name: CI
on:
  push:
    branches: [main, 'noah/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools==84.2.1' 'wheel==0.48.0'
      - run: make dev
      - run: make check
      - run: make demo
