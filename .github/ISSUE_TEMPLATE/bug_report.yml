name: Bug report
description: Report a problem with diffnote
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repo
    attributes:
      label: Reproduce
      description: Steps + a sample repo/diff that triggers it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: diffnote version
      placeholder: "0.1.0"
  - type: input
    id: os
    attributes:
      label: OS / Python
      placeholder: "macOS 14 / Python 3.12"
